name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["development"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f v2/requirements.txt ]; then pip install -r v2/requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 v2 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 v2 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  testing:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cd v2
          cat > .env << EOF
          # Database configuration
          DATABASE_URL="sqlite+aiosqlite:///./data/mobypark.db"
          # Bearer token secret key
          SECRET_KEY="test-secret-key"
          DEFAULT_ADMIN_PASSWORD="test-admin-password"
          EOF
      - name: Start Docker services
        run: |
          cd v2
          docker compose up -d
      - name: Wait for database initialization
        run: |
          cd v2
          echo "Waiting for db-init to complete..."

          # Wait for db-init container to finish (max 90 seconds)
          CONTAINER_NAME="v2-db-init-1"
          for i in {1..30}; do
            if docker ps -a --filter "name=$CONTAINER_NAME" --filter "status=exited" --format '{{.Names}}' | grep -q "$CONTAINER_NAME"; then
              echo "db-init container has exited"
              break
            fi
            echo "Waiting for db-init... ($i/30)"
            sleep 3
          done

          # Show db-init logs
          echo "=== DB Init Logs ==="
          docker logs $CONTAINER_NAME

          # Check exit code
          EXIT_CODE=$(docker inspect $CONTAINER_NAME --format='{{.State.ExitCode}}')
          echo "db-init exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "ERROR: db-init failed with exit code $EXIT_CODE"
            exit 1
          fi

          echo "Database initialization completed successfully"
      - name: Verify database initialization
        run: |
          docker exec v2-api-1 ls -la /code/data/mobypark.db
          docker exec v2-api-1 sqlite3 /code/data/mobypark.db "SELECT COUNT(*) FROM users;" || exit 1
          echo "Database verification passed"
      - name: Wait for API to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8000/docs > /dev/null 2>&1; do echo "Waiting for API..."; sleep 2; done'
          echo "API is ready"
      - name: Run unit tests
        run: |
          docker exec v2-api-1 pytest tests/unit/ -v --maxfail=1 --disable-warnings
      - name: Run integration tests
        run: |
          docker exec v2-api-1 pytest tests/integration/ -v --maxfail=5
      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== DB Init Logs ==="
          docker logs v2-db-init-1 || true
          echo "=== API Logs ==="
          docker logs v2-api-1 || true
      - name: Stop Docker services and cleanup
        if: always()
        run: |
          cd v2
          docker compose down -v
          rm -f .env
  build-and-push:
    needs: testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./v2
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mobypark:latest
            ${{ secrets.DOCKER_USERNAME }}/mobypark:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max